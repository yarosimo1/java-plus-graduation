spring:
  application:
    name: collector
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    metadata-map:
      grpcPort: ${COLLECTOR_GRPC_PORT:59091}

grpc:
  server:
    port: ${COLLECTOR_GRPC_PORT:59091}

management:
    endpoints:
      web:
        exposure:
          include: health,info
