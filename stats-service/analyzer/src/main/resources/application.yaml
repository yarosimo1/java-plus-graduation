spring:
  application:
    name: analyzer
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    metadata-map:
      grpcPort: ${ANALYZER_GRPC_PORT:59092}

grpc:
  server:
    port: ${ANALYZER_GRPC_PORT:59092}

management:
  endpoints:
    web:
      exposure:
        include: health,info